<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | QueueCare</title>

    <link rel="stylesheet" href="./register.css">
    <script src="./register.js" defer></script>
</head>
<body>

    <div class="background">
        <div class="blob blob-one"></div>
        <div class="blob blob-two"></div>
        <div class="blob blob-three"></div>
    </div>

    <header class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">✚</span>
            <span>QueueCare</span>
        </a>

        <p class="nav-text">
            Already have an account?
            <a href="../login/login.html">Log in</a>
        </p>
    </header>

    <main class="register-container">

        <section class="register-card">

            <div class="card-icon">✚</div>

            <h1>Create your account</h1>
            <p class="subtitle">
                Start managing your clinic visits with ease.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <span class="field-hint">
                        Use a strong password for your account.
                    </span>
                </div>

                <div class="form-group">
                    <label for="role">Account Type</label>

                    <div class="role-wrapper">
                        <span class="role-icon">♙</span>

                        <input
                            type="text"
                            id="role"
                            name="role"
                            value="Patient"
                            readonly
                            aria-readonly="true"
                        >

                        <span class="lock-icon" title="Fixed account type">
                            🔒
                        </span>
                    </div>

                    <span class="field-hint">
                        Your account type is set to Patient.
                    </span>
                </div>

                <button type="submit" class="register-button">
                    Create Account
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <div class="divider">
                <span>YOUR HEALTH, OUR PRIORITY</span>
            </div>

            <p class="login-text">
                Already registered?
                <a href="../login/login.html">Sign in here</a>
            </p>

        </section>

        <p class="footer-text">
            © <span id="currentYear"></span> QueueCare.
            Making healthcare simpler.
        </p>

    </main>

    <script src="../config.js"></script>
</body>
</html>
